name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: 构建 deb
    # 用 22.04 构建，产物在 22.04 / 24.04 上都能装
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev dpkg-dev

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: 校验 tag 与项目版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -n 's/^project(LumeShot VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          echo "tag=$tag_version project=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 CMakeLists.txt 中的版本 $project_version 不一致"
            exit 1
          fi

      - name: 配置并构建
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: 打包 deb
        run: cpack --config build/CPackConfig.cmake -B build/package

      - name: 校验安装包
        run: |
          deb=$(ls build/package/*.deb | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          deb_version=$(dpkg-deb -f "$deb" Version)
          echo "包版本: $deb_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$deb_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::deb 版本 $deb_version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          fi

          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          "$root/opt/lumeshot/bin/lumeshot" --version
          if ldd "$root/opt/lumeshot/bin/lumeshot" | grep -q "not found"; then
            echo "::error::安装包内存在未解析的依赖"
            ldd "$root/opt/lumeshot/bin/lumeshot" | grep "not found"
            exit 1
          fi
          if ! readelf -d "$root/opt/lumeshot/bin/lumeshot" | grep -q 'RUNPATH.*\$ORIGIN/../lib'; then
            echo "::error::程序 RUNPATH 不是预期的相对路径"
            readelf -d "$root/opt/lumeshot/bin/lumeshot" | grep -E 'RUNPATH|RPATH' || true
            exit 1
          fi

      - name: 生成校验文件
        run: |
          cd build/package
          sha256sum *.deb > checksums.sha256
          sha256sum -c checksums.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: lumeshot-deb
          path: |
            build/package/*.deb
            build/package/checksums.sha256
          if-no-files-found: error

  release:
    name: 创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-22.04

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: lumeshot-deb
          path: dist

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.sha256
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
