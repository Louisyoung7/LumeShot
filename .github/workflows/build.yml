name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: 构建 deb
    # 用 22.04 构建，产物在 22.04 / 24.04 上都能装
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev dpkg-dev

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: 校验 tag 与项目版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -n 's/^project(LumeShot VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          echo "tag=$tag_version project=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 CMakeLists.txt 中的版本 $project_version 不一致"
            exit 1
          fi

      - name: 构建 deb
        run: ./packaging/build-deb.sh

      - name: 校验安装包版本
        run: |
          deb_version=$(dpkg-deb -f build/deb-out/*.deb Version)
          echo "包版本: $deb_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$deb_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::deb 版本 $deb_version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: lumeshot-deb
          path: |
            build/deb-out/*.deb
            build/deb-out/*.sha256
          if-no-files-found: error

  release:
    name: 创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-22.04

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: lumeshot-deb
          path: dist

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.sha256
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
